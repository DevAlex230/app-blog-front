@if (posts.isLoading()) {
  <p>Завантаження…</p>
} @else if (posts.error()) {
  <p>Не вдалося завантажити пости.</p>
} @else {
  <div class="post-grid">
    @for (post of posts.value(); track post.id) {
      <article (click)="routeToPostDetail(post.id)" class="post-grid--item">
        <h2>{{ post.title }}</h2>
        <p>{{ post.excerpt }}</p>
        <small>{{ post.author }} — {{ post.createdAt | date: 'dd.MM.yyyy' }}</small>
      </article>
    } @empty {
      <p>Постів поки немає.</p>
    }
  </div>
}
